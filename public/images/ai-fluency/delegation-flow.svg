<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#8a7f70"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#faf6ee"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#2b2620">委派的三层递进</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#8a7f70">Delegation · 在引入 AI 之前，先回答这三个问题</text>

  <g>
    <rect x="40" y="100" width="210" height="110" rx="12" fill="#fffdf8" stroke="#d8cfbd" stroke-width="2"/>
    <text x="145" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">问题意识</text>
    <text x="145" y="158" text-anchor="middle" font-size="12" fill="#8a7f70">Problem Awareness</text>
    <text x="145" y="182" text-anchor="middle" font-size="12" fill="#8a7f70">先理解目标与工作的本质</text>
  </g>
  <g>
    <rect x="295" y="100" width="210" height="110" rx="12" fill="#fffdf8" stroke="#d8cfbd" stroke-width="2"/>
    <text x="400" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">平台意识</text>
    <text x="400" y="158" text-anchor="middle" font-size="12" fill="#8a7f70">Platform Awareness</text>
    <text x="400" y="182" text-anchor="middle" font-size="12" fill="#8a7f70">了解 AI 的能力与局限</text>
  </g>
  <g>
    <rect x="550" y="100" width="210" height="110" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
    <text x="655" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">任务委派</text>
    <text x="655" y="158" text-anchor="middle" font-size="12" fill="#8a7f70">Task Delegation</text>
    <text x="655" y="182" text-anchor="middle" font-size="12" fill="#8a7f70">在人与 AI 间策略分工</text>
  </g>
  <g stroke="#8a7f70" stroke-width="2.5" fill="none">
    <line x1="250" y1="155" x2="295" y2="155" marker-end="url(#arrD)"/>
    <line x1="505" y1="155" x2="550" y2="155" marker-end="url(#arrD)"/>
  </g>

  <rect x="40" y="250" width="720" height="110" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2"/>
  <text x="400" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#b23a1e">有效委派需要双重专业</text>
  <text x="400" y="310" text-anchor="middle" font-size="13" fill="#2b2620">委派者自己的<tspan font-weight="700">领域知识</tspan> ＋ 对 AI 能力的理解 —— 缺任何一边都会误判</text>
  <text x="400" y="334" text-anchor="middle" font-size="12" fill="#8a7f70">辨别不了的任务，也不该轻易委派出去</text>
</svg>
