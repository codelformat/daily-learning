<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#b23a1e"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#faf6ee"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#2b2620">描述-辨别循环</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#8a7f70">Description-Discernment Loop · 每个任务重复执行，直到完成</text>

  <!-- top: Describe -->
  <rect x="300" y="92" width="200" height="92" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="400" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">1 · 描述</text>
  <text x="400" y="146" text-anchor="middle" font-size="12" fill="#8a7f70">Describe</text>
  <text x="400" y="166" text-anchor="middle" font-size="12" fill="#8a7f70">要什么 / 如何做 / 如何互动</text>

  <!-- right: Discern -->
  <rect x="540" y="216" width="200" height="92" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="640" y="248" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">2 · 辨别</text>
  <text x="640" y="270" text-anchor="middle" font-size="12" fill="#8a7f70">Discern</text>
  <text x="640" y="290" text-anchor="middle" font-size="12" fill="#8a7f70">评估产出 / 过程 / 行为</text>

  <!-- bottom: Refine -->
  <rect x="300" y="330" width="200" height="92" rx="12" fill="#fffdf8" stroke="#2b2620" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">3 · 修正</text>
  <text x="400" y="384" text-anchor="middle" font-size="12" fill="#8a7f70">Refine</text>
  <text x="400" y="404" text-anchor="middle" font-size="12" fill="#8a7f70">反馈 / 调整描述 / 迭代</text>

  <!-- left: Integrate -->
  <rect x="60" y="216" width="200" height="92" rx="12" fill="#fffdf8" stroke="#2b2620" stroke-width="2"/>
  <text x="160" y="248" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">4 · 整合</text>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#8a7f70">Integrate</text>
  <text x="160" y="290" text-anchor="middle" font-size="12" fill="#8a7f70">加入专业判断 / 为结果负责</text>

  <!-- arrows clockwise -->
  <g stroke="#b23a1e" stroke-width="2.5" fill="none">
    <path d="M 500 130 Q 560 150 585 216" marker-end="url(#arrV)"/>
    <path d="M 640 308 Q 560 350 505 372" marker-end="url(#arrV)"/>
    <path d="M 300 376 Q 240 350 215 308" marker-end="url(#arrV)"/>
    <path d="M 160 216 Q 240 150 295 132" marker-end="url(#arrV)"/>
  </g>

  <text x="400" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#b23a1e">逐任务循环</text>
  <text x="400" y="284" text-anchor="middle" font-size="12" fill="#8a7f70">直到对结果满意为止</text>
</svg>
