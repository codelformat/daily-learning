<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#b23a1e"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#faf6ee"/>
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2b2620">自主代理循环</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#8a7f70">Agent ≠ Chatbot：推理、规划、在动态工作流中行动</text>

  <!-- four nodes -->
  <rect x="300" y="100" width="200" height="80" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="400" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2620">理解目标</text>
  <text x="400" y="154" text-anchor="middle" font-size="12" fill="#8a7f70">Understand</text>
  <text x="400" y="170" text-anchor="middle" font-size="11.5" fill="#8a7f70">拆解任务、明确输入输出</text>

  <rect x="540" y="180" width="200" height="80" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="640" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2620">规划</text>
  <text x="640" y="234" text-anchor="middle" font-size="12" fill="#8a7f70">Plan</text>
  <text x="640" y="250" text-anchor="middle" font-size="11.5" fill="#8a7f70">多步思考、分阶段提示</text>

  <rect x="300" y="260" width="200" height="80" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="400" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2620">行动</text>
  <text x="400" y="314" text-anchor="middle" font-size="12" fill="#8a7f70">Act</text>
  <text x="400" y="330" text-anchor="middle" font-size="11.5" fill="#8a7f70">调用工具 / 访问 API</text>

  <rect x="60" y="180" width="200" height="80" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="160" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2620">观察</text>
  <text x="160" y="234" text-anchor="middle" font-size="12" fill="#8a7f70">Observe</text>
  <text x="160" y="250" text-anchor="middle" font-size="11.5" fill="#8a7f70">读取结果、写入记忆</text>

  <!-- loop arrows -->
  <g stroke="#b23a1e" stroke-width="2.5" fill="none">
    <path d="M 500 132 Q 560 140 590 180" marker-end="url(#arrR)"/>
    <path d="M 640 260 Q 560 300 505 300" marker-end="url(#arrR)"/>
    <path d="M 300 300 Q 240 300 215 260" marker-end="url(#arrR)"/>
    <path d="M 160 180 Q 240 140 295 132" marker-end="url(#arrR)"/>
  </g>

  <!-- center -->
  <text x="400" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#b23a1e">循环往复</text>
  <text x="400" y="228" text-anchor="middle" font-size="12" fill="#8a7f70">直到任务完成</text>

  <!-- reliability note -->
  <rect x="120" y="368" width="560" height="48" rx="10" fill="#fdf3ec" stroke="#b23a1e" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#b23a1e">可靠性护栏：记忆提供上下文，工具提供事实来源，护栏（guardrails）约束行为</text>
  <text x="400" y="407" text-anchor="middle" font-size="11.5" fill="#8a7f70">课程第 3 章标题即「Expand Workflows and Reliability」</text>
</svg>
