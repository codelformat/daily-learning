<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#b23a1e"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#8a7f70"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#faf6ee"/>
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2b2620">MCP 消息模型</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#8a7f70">JSON-RPC · 请求-响应配对 + 单向通知 · 双向协议</text>

  <!-- client / server boxes -->
  <rect x="70" y="110" width="220" height="120" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="180" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">客户端</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#8a7f70">Client（宿主应用）</text>
  <text x="180" y="196" text-anchor="middle" font-size="12" fill="#8a7f70">发起请求，也可响应反向请求</text>

  <rect x="510" y="110" width="220" height="120" rx="12" fill="#fffdf8" stroke="#b23a1e" stroke-width="2.5"/>
  <text x="620" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2620">服务器</text>
  <text x="620" y="172" text-anchor="middle" font-size="12" fill="#8a7f70">Server（MCP server）</text>
  <text x="620" y="196" text-anchor="middle" font-size="12" fill="#8a7f70">提供 tools / resources / prompts</text>

  <!-- request-result pairs -->
  <g stroke="#b23a1e" stroke-width="2.5" fill="none">
    <path d="M 290 138 L 510 138" marker-end="url(#arrR)"/>
    <path d="M 510 162 L 290 162" marker-end="url(#arrR)"/>
  </g>
  <text x="400" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b23a1e">请求（带 id）</text>
  <text x="400" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#b23a1e">响应（回带 id）</text>

  <!-- notifications -->
  <g stroke="#8a7f70" stroke-width="2" stroke-dasharray="6,4" fill="none">
    <path d="M 290 205 Q 400 240 510 205" marker-end="url(#arrG)"/>
    <path d="M 510 225 Q 400 260 290 225" marker-end="url(#arrG)"/>
  </g>
  <text x="400" y="243" text-anchor="middle" font-size="12" fill="#8a7f70">通知（无 id，不要求响应）</text>

  <!-- message type tables -->
  <g font-size="12" fill="#2b2620">
    <rect x="70" y="290" width="320" height="150" rx="10" fill="#fffdf8" stroke="#d8cfbd" stroke-width="2"/>
    <text x="230" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">请求 → 响应（成对）</text>
    <text x="92" y="342">· Initialize Request → Result</text>
    <text x="92" y="364">· Call Tool Request → Result</text>
    <text x="92" y="386">· List Prompts Request → Result</text>
    <text x="92" y="408">· Read Resource Request → Result</text>
    <text x="92" y="430" fill="#8a7f70">靠 id 字段配对</text>

    <rect x="410" y="290" width="320" height="150" rx="10" fill="#fffdf8" stroke="#d8cfbd" stroke-width="2"/>
    <text x="570" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2620">通知（单向，fire-and-forget）</text>
    <text x="432" y="342">· Progress Notification（长任务进度）</text>
    <text x="432" y="364">· Logging Message（系统日志）</text>
    <text x="432" y="386">· Tool List Changed（工具列表变化）</text>
    <text x="432" y="408">· Resource Updated（资源更新）</text>
    <text x="432" y="430" fill="#8a7f70">无 id，不需要回包</text>
  </g>

  <!-- key insight -->
  <line x1="120" y1="468" x2="680" y2="468" stroke="#b23a1e" stroke-width="3"/>
  <text x="400" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#b23a1e">关键：MCP 是双向协议——客户端和服务器都可以主动发起通信</text>
</svg>
